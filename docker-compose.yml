version: "3.9"
services:
  web:
    build: .
    ports:
      - "8000:8000"
      - "8081:8081"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: gunicorn -c gunicorn_config.py

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static
      - ./uploads:/app/uploads
    depends_on:
      - web
      - centrifugo

  centrifugo:
    image: centrifugo/centrifugo:v5
    ports:
      - "8001:8000"
    volumes:
      - ./centrifugo.json:/centrifugo.json
    command: centrifugo -c centrifugo.json
